<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  body { font: 12px -apple-system, sans-serif; margin: 0; padding: 12px; }
  h3 { margin: 12px 0 4px; font-size: 12px; }
  label { font-weight: 600; }
  select, button { font-size: 12px; padding: 4px 6px; }
  button.primary { background: #18a0fb; color: #fff; border: none; border-radius: 4px; padding: 6px 10px; }
  #xml { width: 100%; height: 220px; box-sizing: border-box; font-family: monospace;
         white-space: pre; overflow: auto; margin-top: 8px; }
  #warnings { color: #b30000; margin-top: 8px; white-space: pre-wrap; }
  #selection { margin-bottom: 8px; padding: 6px 8px; background: #f4f4f4; border-radius: 4px; font-size: 11px; }
  .row { display: flex; gap: 8px; align-items: center; }
  #regions { margin-top: 6px; max-height: 200px; overflow: auto; border: 1px solid #eee; border-radius: 4px; }
  .region { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #f0f0f0; }
  .region .info { flex: 1; min-width: 0; }
  .region .nm { font-weight: 600; }
  .region .tx { color: #777; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 8px; }
  .badge.high { background: #e3f6e8; color: #0a7; }
  .badge.medium { background: #fff4e0; color: #b97000; }
  .badge.low { background: #fde8e8; color: #b30000; }
  details { margin-top: 14px; color: #666; }
  details summary { cursor: pointer; }
</style>
</head>
<body>
  <div id="selection">선택 없음 — 레이어를 하나 선택하세요</div>

  <div class="row">
    <button id="analyze" class="primary">영역 분석</button>
    <span style="color:#888;">프레임을 선택하고 분석 → 타입 확인/수정 → 페이지 생성</span>
  </div>

  <div id="regions"></div>

  <div class="row" style="margin-top:8px;">
    <button id="generate" class="primary">페이지 생성</button>
  </div>

  <textarea id="xml" readonly placeholder="영역 분석 → 페이지 생성 시 결과 XML이 여기에"></textarea>
  <div class="row" style="margin-top:6px;">
    <button id="save">XML 파일로 저장</button>
    <button id="copy">복사</button>
  </div>
  <div id="warnings"></div>

  <details>
    <summary>고급: 단일 스니펫/풀페이지 변환</summary>
    <div class="row" style="margin-top:6px;">
      <select id="type">
        <option value="pageAbsolute">풀페이지(절대좌표)</option>
        <option value="title">타이틀</option>
        <option value="inputTable">입출력테이블</option>
        <option value="grid">그리드</option>
        <option value="singleInput">단일입력폼</option>
        <option value="button">버튼</option>
        <option value="pageContainer">화면시작</option>
      </select>
      <select id="kind">
        <option value="input">인풋</option>
        <option value="select">셀렉트</option>
        <option value="textbox">텍스트</option>
        <option value="textarea">텍스트에어리어</option>
      </select>
      <select id="cols">
        <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option>
      </select>
      <button id="convert">단일 변환</button>
      <button id="dump" title="선택 노드 JSON 덤프">JSON</button>
    </div>
  </details>
  <!--UI_SCRIPT-->
</body>
</html>
